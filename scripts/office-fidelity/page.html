<!doctype html>
<html data-theme="light">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="/styles/index.css">
<style>
  /* The app pins html/body to the window and scrolls inside the host; the
     harness wants every page laid out at once so each can be captured. */
  html, body, #root { height: auto !important; overflow: visible !important; }
  .file-viewer-body, .office-native-root, .docx-body-host { overflow: visible !important; height: auto !important; flex: none !important; }
</style>
</head>
<body>
<div id="root" class="file-preview-shell">
  <div class="file-viewer-body">
    <div class="office-native-root docx-root">
      <div class="docx-style-host" hidden></div>
      <div class="docx-body-host" data-pick-root="true"></div>
    </div>
  </div>
</div>
<script src="/bundle.js"></script>
</body>
</html>
