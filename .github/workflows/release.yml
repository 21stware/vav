name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and publish, e.g. v1.3.1'
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    # node-pty is a native module, so each artifact has to be built on the
    # platform it ships to; there is nothing to cross-compile from.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            name: macOS (Apple silicon)
            # DMG for manual install; ZIP + yml + blockmap for electron-updater.
            artifacts: |
              release/*.dmg
              release/*.zip
              release/*.blockmap
              release/latest-mac.yml
          - os: windows-latest
            name: Windows (x64)
            artifacts: |
              release/*.exe
              release/*.blockmap
              release/latest.yml

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      # macOS: Developer ID sign + notarytool. Secrets are repo Actions secrets.
      # APPLE_API_KEY is the .p8 file body; write it to disk for notarytool.
      - name: Write Apple API key (macOS)
        if: runner.os == 'macOS'
        env:
          APPLE_API_KEY_BODY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          if [ -z "$APPLE_API_KEY_BODY" ] || [ -z "$APPLE_API_KEY_ID" ]; then
            echo "Missing APPLE_API_KEY or APPLE_API_KEY_ID secret" >&2
            exit 1
          fi
          mkdir -p "$HOME/.appstoreconnect"
          KEY_PATH="$HOME/.appstoreconnect/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY_BODY" > "$KEY_PATH"
          # Ensure trailing newline (PEM tools are picky)
          echo >> "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "APPLE_API_KEY=$KEY_PATH" >> "$GITHUB_ENV"

      # `--publish never` keeps uploading in one place: the job below, which
      # sees both platforms' artifacts at once and so can create the release
      # complete rather than amending it twice.
      - name: Package (macOS, signed + notarized)
        if: runner.os == 'macOS'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npx electron-builder --mac --publish never

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: npx electron-builder --win --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Write release notes
        run: |
          cat > notes.md <<'EOF'
          ## macOS (Apple silicon)
          Developer ID signed and notarized. Open the DMG and drag **VAV** to Applications.

          In-app updates use the ZIP + `latest-mac.yml` feed (electron-updater).

          ## Windows (x64)
          Not code-signed. SmartScreen may warn on first run: **More info** → **Run anyway**.

          In-app updates use the NSIS installer + `latest.yml` feed.
          EOF

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          ls -la artifacts
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/* \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
            gh release edit "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --notes-file notes.md
          else
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" \
              --notes-file notes.md \
              artifacts/*
          fi
