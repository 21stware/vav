name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and publish, e.g. v1.3.1'
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    # node-pty is a native module, so each artifact has to be built on the
    # platform it ships to; there is nothing to cross-compile from.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            name: macOS (Apple silicon)
            # DMG for manual install; ZIP + yml + blockmap for electron-updater.
            artifacts: |
              release/*.dmg
              release/*.zip
              release/*.blockmap
              release/latest-mac.yml
          - os: windows-latest
            name: Windows (x64)
            artifacts: |
              release/*.exe
              release/*.blockmap
              release/latest.yml

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # electron-trackpad-utils preinstalls setuptools via pip --user, which
      # Homebrew Python (PEP 668) rejects. Same python3 must already have it.
      - name: Python setuptools (electron-trackpad-utils)
        if: runner.os == 'macOS'
        run: python3 -m pip install --user --break-system-packages setuptools

      - run: npm ci

      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache-dependency-path: sidecar/tailcatbridge/go.sum

      # OfficeCLI binaries are gitignored; fetch the pinned host build into
      # resources/bin so electron-builder extraResources can ship them.
      - name: Fetch OfficeCLI (macOS)
        if: runner.os == 'macOS'
        run: node scripts/fetch-officecli.mjs --target darwin-arm64 --clean

      - name: Fetch OfficeCLI (Windows)
        if: runner.os == 'Windows'
        run: node scripts/fetch-officecli.mjs --target win32-x64 --clean

      - name: Build tailcat sidecar (macOS)
        if: runner.os == 'macOS'
        run: node scripts/build-tailcat-sidecar.mjs --target darwin-arm64

      - name: Build tailcat sidecar (Windows)
        if: runner.os == 'Windows'
        run: node scripts/build-tailcat-sidecar.mjs --target win32-x64

      - run: npm run build

      # macOS: Developer ID sign + notarytool. Secrets are repo Actions secrets.
      # APPLE_API_KEY is the .p8 file body; write it to disk for notarytool.
      - name: Write Apple API key (macOS)
        if: runner.os == 'macOS'
        env:
          APPLE_API_KEY_BODY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          if [ -z "$APPLE_API_KEY_BODY" ] || [ -z "$APPLE_API_KEY_ID" ]; then
            echo "Missing APPLE_API_KEY or APPLE_API_KEY_ID secret" >&2
            exit 1
          fi
          mkdir -p "$HOME/.appstoreconnect"
          KEY_PATH="$HOME/.appstoreconnect/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY_BODY" > "$KEY_PATH"
          # Ensure trailing newline (PEM tools are picky)
          echo >> "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "APPLE_API_KEY=$KEY_PATH" >> "$GITHUB_ENV"

      # `--publish never` keeps uploading in one place: the job below, which
      # sees both platforms' artifacts at once and so can create the release
      # complete rather than amending it twice.
      - name: Package (macOS, signed + notarized)
        if: runner.os == 'macOS'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npx electron-builder --mac --publish never

      # Fail the release if the DMG is still unsigned / unstapled. That state is
      # what surfaces to users as “VAV is damaged and can’t be opened” after a
      # Chrome download (quarantine + Gatekeeper).
      - name: Verify macOS DMG signature + staple
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          shopt -s nullglob
          dmgs=(release/*.dmg)
          if [ ${#dmgs[@]} -eq 0 ]; then
            echo "No release/*.dmg produced" >&2
            exit 1
          fi
          for dmg in "${dmgs[@]}"; do
            echo "=== codesign $dmg ==="
            codesign -dv --verbose=2 "$dmg"
            echo "=== stapler validate $dmg ==="
            xcrun stapler validate "$dmg"
            echo "=== spctl assess $dmg ==="
            spctl -a -t open --context context:primary-signature -vv "$dmg"
          done
          apps=(release/mac-arm64/*.app)
          for app in "${apps[@]}"; do
            echo "=== spctl assess $app ==="
            spctl -a -t exec -vv "$app"
            xcrun stapler validate "$app"
          done

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: npx electron-builder --win --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Write release notes
        run: |
          cat > notes.md <<'EOF'
          ## macOS (Apple silicon)
          Developer ID signed and notarized (app + DMG, ticket stapled). Open the DMG and drag **VAV** to Applications.

          In-app updates use the ZIP + `latest-mac.yml` feed (electron-updater).

          If macOS says the app is “damaged” after a browser download, run:
          `sudo xattr -cr /Applications/VAV.app`

          ## Windows (x64)
          Not code-signed. SmartScreen may warn on first run: **More info** → **Run anyway**.

          In-app updates use the NSIS installer + `latest.yml` feed.

          ## Headless daemon
          `npx @21stware/vavd` — pair from VAV → Settings → Allow other devices.
          EOF

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          ls -la artifacts
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/* \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
            gh release edit "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --notes-file notes.md
          else
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" \
              --notes-file notes.md \
              artifacts/*
          fi

  publish-npm:
    needs: publish
    runs-on: ubuntu-latest
    if: ${{ vars.NPM_PUBLISH != 'skip' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - name: Pack and publish @21stware/vavd
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "NPM_TOKEN is not set; skip npm publish" >&2
            exit 0
          fi
          node scripts/pack-vavd.mjs
          VERSION=$(node -p "require('./packages/vavd/package.json').version")
          if npm view "@21stware/vavd@${VERSION}" version >/dev/null 2>&1; then
            echo "@21stware/vavd@${VERSION} already on npm"
            exit 0
          fi
          npm publish --access public --prefix packages/vavd
