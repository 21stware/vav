# ONE-SHOT: export encrypted signing secrets for migration. Delete after use.
name: _export-secrets-once
on:
  workflow_dispatch:
    inputs:
      pass:
        description: 'openssl passphrase (one-time)'
        required: true
        type: string
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Encrypt secrets bundle
        env:
          PASS: ${{ github.event.inputs.pass }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          umask 077
          mkdir bundle
          printf '%s' "$CSC_LINK" > bundle/CSC_LINK
          printf '%s' "$CSC_KEY_PASSWORD" > bundle/CSC_KEY_PASSWORD
          printf '%s' "$APPLE_API_KEY" > bundle/APPLE_API_KEY
          printf '%s' "$APPLE_API_KEY_ID" > bundle/APPLE_API_KEY_ID
          printf '%s' "$APPLE_API_ISSUER" > bundle/APPLE_API_ISSUER
          printf '%s' "$APPLE_TEAM_ID" > bundle/APPLE_TEAM_ID
          tar -C bundle -czf - . | openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:PASS -out secrets.tgz.enc
          rm -rf bundle
      - uses: actions/upload-artifact@v4
        with:
          name: secrets-bundle
          path: secrets.tgz.enc
          retention-days: 1
