name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Both, because the main process branches on the platform and half of that
    # code is only ever compiled by the runner it targets.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]

    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # electron-trackpad-utils preinstalls setuptools via pip --user, which
      # Homebrew Python (PEP 668) rejects. Same python3 must already have it.
      - name: Python setuptools (electron-trackpad-utils)
        if: runner.os == 'macOS'
        run: python3 -m pip install --user --break-system-packages setuptools

      - run: npm ci

      - name: Unit tests
        run: npm test

      - name: Typecheck and build
        run: npm run build
