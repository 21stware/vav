<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: vav-local: https:; media-src 'self' data: blob: vav-local:; font-src 'self' data: https://fonts.gstatic.com https://cdn.tldraw.com; connect-src 'self' vav-local: https://spec.getoriginai.com https://stately.ai https://*.stately.ai wss://stately.ai wss://*.stately.ai https://cdn.tldraw.com; frame-src 'self' vav-local: blob: https://stately.ai https://*.stately.ai; object-src 'self' vav-local: blob:"
    />
    <link rel="icon" type="image/png" href="/icon.png" />
    <title>vav</title>
    <!--
      Synchronous shell paint before the module graph loads.
      Main / session / settings / token windows all flash system white for a
      frame otherwise — especially ⌘⇧↵ quick sessions in dark mode. Prefer the
      `theme` query from main (app setting); fall back to OS color scheme.
    -->
    <script>
      ;(function () {
        try {
          var q = new URLSearchParams(location.search)
          var theme = q.get('theme')
          var dark =
            theme === 'dark'
              ? true
              : theme === 'light'
                ? false
                : window.matchMedia('(prefers-color-scheme: dark)').matches
          // Main (no view=) and Settings use macOS vibrancy — opaque !important
          // here would permanently mask NSVisualEffectView. Companion windows stay solid.
          var view = q.get('view')
          var clearShell = !view || view === 'settings'
          var bg = clearShell ? 'transparent' : dark ? '#121213' : '#ececee'
          document.documentElement.style.background = bg
          document.documentElement.dataset.theme = dark ? 'dark' : 'light'
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
          var style = document.createElement('style')
          style.textContent =
            'html,body,#root{background:' + bg + '!important;margin:0;height:100%}'
          document.head.appendChild(style)
        } catch (_) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
